<section class="inicio">
  <div class="box">
    <div class="left-side">
      <div class="text">
        <h1 margin-left="40px">
                 Archivo de <br />
          <span>Proveedores</span>
        </h1>
        <img src="../../../assets/img/deal.svg" alt="" />
      </div>
    </div>
    <div class="login-side">
      <div class="login-actions-wrapper">
        <div class="login" *ngIf="identidad == null">
          <form
            #loginForm="ngForm"
            (ngSubmit)="onSubmit()"
          >
            <h5>Iniciar Sesión</h5>
            <input
              type="text"
              name="usuario"
              #usuario="ngModel"
              [(ngModel)]="user.usuario"
              id=""
              placeholder="Usuario"
              required
              maxlength="30"
              minlength="3"
            />
            <span *ngIf="!usuario.valid && usuario.touched" class="rojo">
              Es obligatorio el usuario
            </span>
            <div class="input-con-icono" style="width: 100%">
              <input
                [type]="verPassword ? 'text' : 'password'"
                name="password"
                #password="ngModel"
                [(ngModel)]="user.password"
                placeholder="Contraseña"
                required
                style="width: 100%; padding-right: 35px; box-sizing: border-box"
              />
              <i
                class="fa"
                [ngClass]="verPassword ? 'fa-eye-slash' : 'fa-eye'"
                (click)="verPassword = !verPassword"
                title="Mostrar/Ocultar contraseña"
                style="
                  position: absolute;
                  right: 10px;
                  top: 50%;
                  transform: translateY(-50%);
                  cursor: pointer;
                "
              ></i>
            </div>

            <span *ngIf="!password.valid && password.touched" class="rojo">
              La contraseña es obligatoria
            </span>
            <a [routerLink]="['/recuperar-info']">¿Olvidaste la contraseña?</a>
            <input
              type="submit"
              value="Ingresar"
              [disabled]="!loginForm.form.valid"
            />
          </form>
          <div class="alert verde" *ngIf="status == 'success'">
            Inicio de sesion exitoso, redirigiendo...
          </div>
          <div class="alert rojo" *ngIf="status == 'error'">
            Inicio de Sesion Fallido, Revisa tus credenciales o contacta al
            administrador de la pagina.
          </div>
        </div>
        <div class="index-actions">
          <div *ngIf="identity.rol == 'administrador' || identity.rol == 'administrador_premium' || identity.rol == 'usuario'">
            <button class="index-action-btn" (click)="goToRegisterProv()">
              <img src="../../../assets/img/nuevo.png" alt="Nuevo Proveedor" />
              <span>Nuevo<br />Proveedor</span>
            </button>
          </div>
          <div *ngIf="identity.rol == 'administrador' || identity.rol == 'administrador_premium'">
            <button class="index-action-btn" (click)="goToRegisterUse()">
              <img src="../../../assets/img/trabajando.png" alt="Nuevo Usuario" />
              <span>Nuevo<br />Usuario</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <div *ngIf="identity.rol == 'administrador' || identity.rol == 'administrador_premium'" class="circle"></div>
</section>
