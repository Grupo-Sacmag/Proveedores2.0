<div class="modern-container">
  <div class="modern-card">
    <div class="card-header-icon">
      <div class="icon-circle">
        <i class="fas fa-file-archive"></i>
      </div>
    </div>
    
    <h2>Descarga Global de Expedientes</h2>
    <p class="description">
      Genera un paquete consolidado (ZIP) con toda la documentación de los proveedores, organizada por RFC.
    </p>

    <div class="action-area">
      <button 
        (click)="descargarTodosLosRFCsZIP()" 
        [disabled]="descargandoZIP" 
        class="modern-btn"
        [class.downloading]="descargandoZIP"
      >
        <i class="fas" [ngClass]="descargandoZIP ? 'fa-spinner fa-spin' : 'fa-cloud-download-alt'"></i>
        <span>{{ descargandoZIP ? "Preparando Archivos..." : "Descargar Paquete ZIP" }}</span>
      </button>
    </div>

    <div class="progress-section" [class.show]="descargandoZIP">
      <div class="progress-bar-container">
        <div class="progress-bar-fill" [style.width.%]="displayProgress" [class.complete]="displayProgress === 100"></div>
      </div>
      <div class="progress-stats">
        <span class="progress-text">{{ displayProgress === 100 ? '¡Completado!' : 'Procesando archivos...' }}</span>
        <span class="progress-percent">{{ displayProgress }}%</span>
      </div>
      <p class="waiting-text">Por favor, espera un momento. Tómate un café ☕</p>
    </div>

    <div *ngIf="mensaje" class="message-banner" [ngClass]="{'success': mensaje.includes('éxito'), 'error': mensaje.includes('problema') || mensaje.includes('error')}">
      <i class="fas" [ngClass]="mensaje.includes('éxito') ? 'fa-check-circle' : 'fa-exclamation-circle'"></i>
      {{ mensaje }}
    </div>
  </div>
</div>
